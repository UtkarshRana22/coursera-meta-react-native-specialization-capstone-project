<text x="465" y="282" stroke="none" fill="#EDEFEE" font-size="12">Family owned Mediterranean</text><text x="465" y="298" stroke="none" fill="#EDEFEE" font-size="12">restaurant, traditional recipes</text><text x="465" y="314" stroke="none" fill="#EDEFEE" font-size="12">with a modern twist.</text>
