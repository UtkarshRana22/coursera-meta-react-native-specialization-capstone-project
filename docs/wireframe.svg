<!-- arrows -->
<g stroke="#495E57" stroke-width="3" fill="#495E57">
<path d="M370 400 H430" fill="none"/><polygon points="430,392 445,400 430,408"/>
<path d="M765 400 H825" fill="none"/><polygon points="825,392 840,400 825,408"/></g>
<text x="402" y="388" text-anchor="middle" font-size="12" fill="#495E57">Next</text><text x="797" y="388" text-anchor="middle" font-size="12" fill="#495E57">Profile icon</text>
<text x="600" y="745" text-anchor="middle" font-size="13" fill="#666">Log out clears stored data and returns to Onboarding · Back arrow returns from Profile to Home (stack navigation)</text>
